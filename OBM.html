<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offre OBM | Assist by Alicia</title>
  <meta name="description" content="Découvre l'offre OBM d'Assist by Alicia : pilotage opérationnel, structuration, Notion, IA et automatisation pour les entrepreneures qui veulent reprendre le contrôle de leur business." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&family=Satisfy&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --coral: #ff4757;
      --yellow: #caff00;
      --blue-dark: #1e2a4a;
      --black: #121212;
      --white: #ffffff;
      --border: rgba(202, 255, 0, 0.12);
      --text-muted: rgba(255, 255, 255, 0.72);
      --text-faint: rgba(255, 255, 255, 0.42);
      --surface: rgba(30, 42, 74, 0.28);
      --surface-2: rgba(255, 255, 255, 0.03);

      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --text-3xl: clamp(2.5rem, 1rem + 4vw, 5rem);

      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --space-24: 6rem;

      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;

      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);

      --font-display: "League Spartan", sans-serif;
      --font-script: "Satisfy", cursive;
      --font-body: "Montserrat", sans-serif;
      --content-default: 1080px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: none; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.7;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    main { flex: 1; }

    img { display: block; max-width: 100%; height: auto; }
    a, button { transition: color var(--transition), background var(--transition), box-shadow var(--transition); }
    p { color: var(--text-muted); max-width: 70ch; }
    :focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; border-radius: var(--radius-sm); }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-12);
    }

    .logo { text-decoration: none; display: flex; align-items: center; }

    .logo img {
      max-width: 200px;
      height: 68px;
      object-fit: contain;
    }

    .nav-links { list-style: none; display: flex; gap: var(--space-8); align-items: center; }

    .nav-links a, .menu-link {
      color: var(--white);
      text-decoration: none;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links a:hover, .dropdown:hover .menu-link, .nav-links a.active { color: var(--yellow); }
    .dropdown { position: relative; }

    .submenu {
      list-style: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 240px;
      display: none;
      flex-direction: column;
      background: rgba(18, 18, 18, 0.98);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-2) 0;
      box-shadow: var(--shadow-lg);
    }

    .submenu a {
      display: block;
      padding: 0.85rem 1rem;
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .dropdown:hover .submenu { display: flex; }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid rgba(202, 255, 0, 0.18);
      color: var(--white);
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-direction: column;
      gap: 4px;
    }

    .menu-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--white);
      border-radius: 99px;
    }

    .mobile-menu { display: none; }

    .hero {
      min-height: 88vh;
      display: grid;
      place-items: center;
      padding: 9rem var(--space-8) var(--space-16);
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%, rgba(30, 42, 74, 0.85) 0%, transparent 70%),
        repeating-linear-gradient(0deg, rgba(202,255,0,0.025) 0px, rgba(202,255,0,0.025) 1px, transparent 1px, transparent 60px),
        repeating-linear-gradient(90deg, rgba(202,255,0,0.025) 0px, rgba(202,255,0,0.025) 1px, transparent 1px, transparent 60px),
        var(--black);
    }

    .hero-inner { max-width: 980px; text-align: center; }

    .eyebrow {
      font-family: var(--font-script);
      color: var(--coral);
      font-size: 1.5rem;
      margin-bottom: var(--space-4);
    }

    h1 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      line-height: 1.08;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: var(--space-5);
    }

    h1 span { color: var(--coral); }
    h1 em { color: var(--yellow); font-style: normal; }
    .hero p { margin-inline: auto; }

    .hero-actions {
      margin-top: var(--space-8);
      display: flex;
      gap: var(--space-4);
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary, .btn-secondary {
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-3) var(--space-8);
      text-decoration: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: var(--text-sm);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .btn-primary {
      background: var(--coral);
      color: var(--white);
      box-shadow: 0 0 20px rgba(255,71,87,0.35);
    }

    .btn-primary:hover {
      background: #e03040;
      box-shadow: 0 0 30px rgba(255,71,87,0.5);
    }

    .btn-secondary {
      color: var(--yellow);
      border: 1.5px solid var(--yellow);
    }

    .btn-secondary:hover { background: rgba(202,255,0,0.08); }

    .section-wrap {
      max-width: var(--content-default);
      margin: 0 auto;
      padding: clamp(var(--space-12), 7vw, var(--space-24)) var(--space-8);
    }

    .section-wrap.tight { padding-top: 0; }

    .section-tag {
      font-family: var(--font-script);
      color: var(--coral);
      font-size: 1.35rem;
      margin-bottom: var(--space-2);
    }

    h2 {
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      line-height: 1.08;
      text-transform: uppercase;
      font-weight: 900;
      margin-bottom: var(--space-6);
    }

    h2 span { color: var(--coral); }
    h2 em { color: var(--yellow); font-style: normal; }

    h3 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      line-height: 1.12;
      text-transform: uppercase;
      font-weight: 700;
    }

    .intro-card, .quote-card, .pricing-card, .faq-item, .card, .timeline-card {
      background: var(--surface);
      border: 1px solid rgba(202,255,0,0.10);
      border-radius: var(--radius-xl);
    }

    .intro-card { padding: var(--space-10); }

    .quote-card {
      padding: var(--space-10);
      text-align: center;
      border-color: rgba(255,71,87,0.2);
      background: rgba(255,71,87,0.08);
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      text-transform: uppercase;
    }

    .grid-2 { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: var(--space-6); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); }

    .card { padding: var(--space-8); }
    .card h3 { margin-bottom: var(--space-3); color: var(--yellow); }
    .card p { max-width: 100%; font-size: var(--text-sm); }
    .card ul { list-style: none; margin-top: var(--space-4); display: grid; gap: var(--space-2); }
    .card li { color: var(--text-muted); font-size: var(--text-sm); display: flex; gap: 0.6rem; }
    .card li::before { content: "→"; color: var(--yellow); font-weight: 700; }

    .timeline { display: grid; gap: var(--space-4); margin-top: var(--space-8); }

    .timeline-card {
      padding: var(--space-6) var(--space-8);
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: var(--space-5);
      align-items: start;
    }

    .timeline-step {
      font-family: var(--font-display);
      color: var(--coral);
      font-size: var(--text-lg);
      font-weight: 900;
      text-transform: uppercase;
    }

    .timeline-card h3 { margin-bottom: var(--space-2); }
    .timeline-card p { max-width: 100%; }

    .pricing-card { padding: var(--space-10); }

    .pricing-badge {
      display: inline-flex;
      width: fit-content;
      padding: 0.35rem 0.8rem;
      border-radius: var(--radius-full);
      border: 1px solid rgba(255,71,87,0.28);
      color: var(--coral);
      background: rgba(255,71,87,0.12);
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: var(--space-4);
    }

    .price {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 1.6rem + 2vw, 3.4rem);
      line-height: 1;
      font-weight: 900;
      color: var(--white);
      margin: var(--space-4) 0;
    }

    .price small {
      font-size: var(--text-sm);
      color: var(--text-muted);
      font-family: var(--font-body);
      font-weight: 500;
    }

    .pricing-list {
      list-style: none;
      display: grid;
      gap: var(--space-3);
      margin: var(--space-6) 0;
    }

    .pricing-list li { display: flex; gap: 0.6rem; color: var(--text-muted); }
    .pricing-list li::before { content: "✓"; color: var(--yellow); font-weight: 700; }
    .pricing-note { font-size: var(--text-xs); color: var(--text-faint); }

    .faq { display: grid; gap: var(--space-4); margin-top: var(--space-8); }
    .faq-item { padding: var(--space-6) var(--space-8); }
    .faq-item h3 { font-size: var(--text-base); color: var(--white); margin-bottom: var(--space-2); }
    .faq-item p { max-width: 100%; font-size: var(--text-sm); }

    .cta-section {
      text-align: center;
      padding: clamp(var(--space-16), 10vw, var(--space-24)) var(--space-8);
    }

    .cta-section p {
      margin: var(--space-4) auto var(--space-8);
      max-width: 60ch;
    }

    footer {
      margin-top: auto;
      background: rgba(18, 18, 18, 0.98);
      border-top: 1px solid rgba(202,255,0,0.08);
      padding: var(--space-8) var(--space-12);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-xs);
      color: var(--text-faint);
      flex-wrap: wrap;
      gap: var(--space-4);
    }

    .footer-links { display: flex; gap: var(--space-6); flex-wrap: wrap; }

    footer a {
      color: var(--text-faint);
      text-decoration: none;
    }

    footer a:hover { color: var(--white); }

      .menu-toggle { display: inline-flex; }

        box-shadow: var(--shadow-lg);
        z-index: 999;
      }
