<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assist by Alicia | OBM & Systèmes Notion sur-mesure</title>
  <meta
    name="description"
    content="Alicia, OBM spécialisée Notion, IA et automatisation. Je structure ton business, pilote tes opérations et crée des systèmes sur-mesure."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;600;700;800;900&family=Satisfy&family=Montserrat:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --coral: #ff4757;
      --yellow: #caff00;
      --blue-dark: #1e2a4a;
      --black: #121212;
      --white: #ffffff;
      --surface: #1a1a1a;
      --surface-2: #202020;
      --border: rgba(202, 255, 0, 0.12);
      --text-muted: rgba(255, 255, 255, 0.7);
      --text-faint: rgba(255, 255, 255, 0.42);

      --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
      --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
      --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
      --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
      --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
      --text-2xl: clamp(2rem, 1.2rem + 2.5vw, 3.5rem);
      --text-3xl: clamp(2.5rem, 1rem + 4vw, 5rem);

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --space-10: 2.5rem;
      --space-12: 3rem;
      --space-16: 4rem;
      --space-20: 5rem;
      --space-24: 6rem;

      --radius-sm: 0.375rem;
      --radius-md: 0.5rem;
      --radius-lg: 0.75rem;
      --radius-xl: 1rem;
      --radius-full: 9999px;

      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.32);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.45);

      --content-default: 1000px;

      --font-display: "League Spartan", sans-serif;
      --font-script: "Satisfy", cursive;
      --font-body: "Montserrat", sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: none;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--font-body);
      font-size: var(--text-base);
      line-height: 1.7;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    main {
      flex: 1;
    }

    img,
    video {
      display: block;
      max-width: 100%;
      height: auto;
    }

    a,
    button {
      transition:
        color var(--transition),
        background var(--transition),
        box-shadow var(--transition);
    }

    p {
      color: var(--text-muted);
      max-width: 68ch;
    }

    :focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(18, 18, 18, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-12);
    }

    .logo {
      text-decoration: none;
      display: flex;
      align-items: center;
    }

    .logo img {
      max-width: 200px;
      height: 68px;
      object-fit: contain;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: var(--space-8);
      align-items: center;
    }

    .nav-links a,
    .menu-link {
      color: var(--white);
      text-decoration: none;
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-links a:hover,
    .dropdown:hover .menu-link {
      color: var(--yellow);
    }

    .dropdown {
      position: relative;
    }

    .submenu {
      list-style: none;
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 240px;
      display: none;
      flex-direction: column;
      background: rgba(18, 18, 18, 0.98);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-2) 0;
      box-shadow: var(--shadow-lg);
    }

    .submenu a {
      display: block;
      padding: 0.85rem 1rem;
      font-size: var(--text-xs);
      white-space: nowrap;
    }

    .dropdown:hover .submenu {
      display: flex;
    }

    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid rgba(202, 255, 0, 0.18);
      color: var(--white);
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-direction: column;
      gap: 4px;
    }

    .menu-toggle span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--white);
      border-radius: 99px;
    }

    .mobile-menu {
      display: none;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem var(--space-8) var(--space-16);
      background:
        radial-gradient(
          ellipse 70% 55% at 50% 38%,
          rgba(30, 42, 74, 0.85) 0%,
          transparent 70%
        ),
        repeating-linear-gradient(
          0deg,
          rgba(202, 255, 0, 0.025) 0px,
          rgba(202, 255, 0, 0.025) 1px,
          transparent 1px,
          transparent 60px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(202, 255, 0, 0.025) 0px,
          rgba(202, 255, 0, 0.025) 1px,
          transparent 1px,
          transparent 60px
        ),
        var(--black);
    }

    .hero-eyebrow {
      font-family: var(--font-script);
      color: var(--coral);
      font-size: 1.5rem;
      margin-bottom: var(--space-4);
    }

    .hero h1 {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: var(--text-3xl);
      line-height: 1.06;
      text-transform: uppercase;
      max-width: 860px;
    }

    .hero h1 span {
      color: var(--coral);
    }

    .hero h1 em {
      color: var(--yellow);
      font-style: normal;
    }

    .hero-sub {
      margin-top: var(--space-6);
      font-size: var(--text-base);
      max-width: 620px;
      color: var(--text-muted);
      line-height: 1.8;
    }

    .hero-pills {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
      justify-content: center;
      margin-top: var(--space-6);
    }

    .pill {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      background: rgba(202, 255, 0, 0.07);
      border: 1px solid rgba(202, 255, 0, 0.25);
      color: var(--yellow);
    }

    .pill.accent {
      background: rgba(255, 71, 87, 0.08);
      border-color: rgba(255, 71, 87, 0.3);
      color: var(--coral);
    }

    .hero-ctas {
      margin-top: var(--space-10);
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-primary {
      background: var(--coral);
      color: var(--white);
      padding: var(--space-3) var(--space-8);
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none;
      box-shadow: 0 0 20px rgba(255, 71, 87, 0.35);
      display: inline-flex;
      align-items: center;
      min-height: 52px;
    }

    .btn-primary:hover {
      background: #e03040;
      box-shadow: 0 0 32px rgba(255, 71, 87, 0.55);
    }

    .btn-secondary {
      background: transparent;
      color: var(--yellow);
      padding: var(--space-3) var(--space-8);
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--yellow);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: var(--text-sm);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      min-height: 52px;
    }

    .btn-secondary:hover {
      background: rgba(202, 255, 0, 0.08);
      box-shadow: 0 0 20px rgba(202, 255, 0, 0.2);
    }

    .btn-ghost {
      color: var(--text-muted);
      font-size: var(--text-sm);
      text-decoration: none;
      font-family: var(--font-display);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 2px;
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
    }

    .btn-ghost:hover {
      color: var(--white);
      border-color: var(--white);
    }

    .section-wrap {
      max-width: var(--content-default);
      margin: 0 auto;
      padding: clamp(var(--space-12), 7vw, var(--space-24)) var(--space-8);
    }

    .section-tag {
      font-family: var(--font-script);
      color: var(--coral);
      font-size: 1.4rem;
      margin-bottom: var(--space-2);
    }

    h2 {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: var(--text-2xl);
      text-transform: uppercase;
      line-height: 1.08;
      margin-bottom: var(--space-6);
    }

    h2 span {
      color: var(--coral);
    }

    h2 em {
      color: var(--yellow);
      font-style: normal;
    }

    h3 {
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .probleme-block {
      background: rgba(30, 42, 74, 0.3);
      border-left: 3px solid var(--coral);
      border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
      padding: var(--space-10);
    }

    .highlight-quote {
      margin-top: var(--space-6);
      padding: var(--space-5) var(--space-6);
      background: rgba(255, 71, 87, 0.08);
      border: 1px solid rgba(255, 71, 87, 0.2);
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: var(--text-lg);
      font-weight: 700;
      text-align: center;
      color: var(--white);
      text-transform: uppercase;
    }

    .offres-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-6);
      margin-top: var(--space-8);
    }

    .offre-card {
      background: rgba(30, 42, 74, 0.38);
      border: 1px solid rgba(202, 255, 0, 0.12);
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .offre-card.featured {
      border-color: rgba(255, 71, 87, 0.35);
    }

    .offre-badge {
      font-family: var(--font-display);
      font-size: var(--text-xs);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      display: inline-flex;
      width: fit-content;
    }

    .badge-express {
      background: rgba(255, 71, 87, 0.15);
      color: var(--coral);
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .badge-obm {
      background: rgba(202, 255, 0, 0.1);
      color: var(--yellow);
      border: 1px solid rgba(202, 255, 0, 0.25);
    }

    .offre-card h3 {
      color: var(--white);
      margin-top: var(--space-1);
    }

    .offre-card p {
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin: 0;
      max-width: 100%;
    }

    .offre-liste {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      margin-top: var(--space-2);
    }

    .offre-liste li {
      font-size: var(--text-sm);
      color: var(--text-muted);
      display: flex;
      align-items: flex-start;
      gap: var(--space-2);
    }

    .offre-liste li::before {
      content: "→";
      color: var(--yellow);
      font-weight: 700;
      flex-shrink: 0;
    }

    .offre-card .btn-primary,
    .offre-card .btn-secondary {
      margin-top: auto;
      align-self: flex-start;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-5);
