<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Création d'espace Notion sur-mesure | Assist by Alicia</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Satisfy&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --coral:#ff4757;
      --yellow:#caff00;
      --black:#121212;
      --white:#ffffff;
      --muted:rgba(255,255,255,0.72);
      --faint:rgba(255,255,255,0.45);

      --s2:.5rem;
      --s3:.75rem;
      --s4:1rem;
      --s5:1.25rem;
      --s6:1.5rem;
      --s8:2rem;
      --s12:3rem;
      --s16:4rem;
      --s24:6rem;

      --r:.9rem;
      --max:1040px;

      --display:'League Spartan',sans-serif;
      --script:'Satisfy',cursive;
      --body:'Montserrat',sans-serif;
    }

    *,*::before,*::after{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html{
      -webkit-text-size-adjust:none;
      scroll-behavior:smooth;
    }

    body{
      background:var(--black);
      color:var(--white);
      font-family:var(--body);
      line-height:1.7;
    }

    p{
      color:var(--muted);
      max-width:72ch;
    }

    a{
      text-decoration:none;
    }

    /* Layout de base */

    .wrap{
      max-width:var(--max);
      margin:0 auto;
      padding:clamp(var(--s12),7vw,var(--s24)) 2rem;
    }

    .tag{
      font-family:var(--script);
      color:var(--coral);
      font-size:1.4rem;
      margin-bottom:.5rem;
    }

    h2{
      font-family:var(--display);
      font-size:clamp(2rem,1.2rem + 2.5vw,3.5rem);
      text-transform:uppercase;
      line-height:1.08;
      margin-bottom:var(--s6);
    }

    h2 span{color:var(--coral);}
    h2 em{color:var(--yellow);font-style:normal;}

    h3{
      font-family:var(--display);
      font-size:1.2rem;
      text-transform:uppercase;
      margin-bottom:var(--s3);
    }

    /* Navigation */

    nav{
      position:fixed;
      inset:0 0 auto 0;
      z-index:1000;
      background:rgba(18,18,18,.92);
      backdrop-filter:blur(10px);
      border-bottom:1px solid rgba(202,255,0,.12);
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:1rem 4rem;
    }

    .logo{
      color:#fff;
      font-family:var(--display);
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .nav-links{
      display:flex;
      gap:2rem;
      list-style:none;
    }

    .nav-links a{
      color:#fff;
      font-size:.85rem;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .nav-links a:hover{
      color:var(--yellow);
    }

    /* Hero */

    .hero{
      min-height:72vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:8rem 2rem 4rem;
      background:
        radial-gradient(ellipse 70% 55% at 50% 38%,rgba(30,42,74,.82) 0%,transparent 70%),
        repeating-linear-gradient(0deg,rgba(202,255,0,.025) 0,rgba(202,255,0,.025) 1px,transparent 1px,transparent 60px),
        repeating-linear-gradient(90deg,rgba(202,255,0,.025) 0,rgba(202,255,0,.025) 1px,transparent 1px,transparent 60px),
        var(--black);
    }

    .hero .eyebrow{
      font-family:var(--script);
      color:var(--coral);
      font-size:1.5rem;
      margin-bottom:var(--s4);
    }

    .hero h1{
      font-family:var(--display);
      font-size:clamp(2rem,1.2rem + 2.5vw,3.5rem);
      text-transform:uppercase;
      line-height:1.08;
      max-width:920px;
    }

    .hero h1 span{color:var(--coral);}
    .hero h1 em{color:var(--yellow);font-style:normal;}

    .hero p{
      margin-top:var(--s6);
      max-width:760px;
    }

    .pills{
      display:flex;
      gap:var(--s2);
      flex-wrap:wrap;
      justify-content:center;
      margin-top:var(--s6);
    }

    .pill{
      font-family:var(--display);
      font-size:.75rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.07em;
      padding:.5rem 1rem;
      border-radius:999px;
      background:rgba(202,255,0,.07);
      border:1px solid rgba(202,255,0,.24);
      color:var(--yellow);
    }

    .pill.accent{
      background:rgba(255,71,87,.08);
      border-color:rgba(255,71,87,.3);
      color:var(--coral);
    }

    /* Cartes et blocs */

    .card,
    .quote,
    .problem,
    .solution,
    .step,
    .deliverable,
    details{
      background:rgba(30,42,74,.22);
      border:1px solid rgba(202,255,0,.10);
      border-radius:var(--r);
      padding:var(--s6);
    }

    .quote{
      background:rgba(255,71,87,.08);
      border-color:rgba(255,71,87,.18);
    }

    .quote strong{
      display:block;
      font-family:var(--display);
      font-size:1.2rem;
      text-transform:uppercase;
      margin-bottom:var(--s3);
    }

    ul{list-style:none;}

    .card ul,
    .problem ul,
    .solution ul{
      display:flex;
      flex-direction:column;
      gap:var(--s3);
    }

    .card li,
    .problem li,
    .solution li{
      display:flex;
      gap:.65rem;
      color:var(--muted);
    }

    .card li::before{
      content:"→";
      color:var(--yellow);
      font-weight:700;
    }

    .problem{
      background:rgba(255,71,87,.06);
      border-color:rgba(255,71,87,.15);
    }

    .solution{
      background:rgba(202,255,0,.04);
      border-color:rgba(202,255,0,.15);
    }

    .label{
      font-family:var(--display);
      font-size:.75rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.1em;
      margin-bottom:var(--s4);
    }

    .problem .label{color:var(--coral);}
    .solution .label{color:var(--yellow);}

    /* Grilles */

    .three-layout{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:var(--s6);
    }

    .full{
      grid-column:1/-1;
    }

    .content-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:var(--s8);
    }

    .stack{
      display:flex;
      flex-direction:column;
      gap:var(--s6);
    }

    .two{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:var(--s6);
    }

    .steps{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:var(--s5);
      margin-top:var(--s8);
    }

    .step-num{
      font-family:var(--display);
      font-size:3rem;
      color:rgba(202,255,0,.12);
      line-height:1;
      margin-bottom:var(--s3);
    }

    .deliverables{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:var(--s5);
      margin-top:var(--s8);
    }

    .deliverable{
      display:grid;
      grid-template-columns:48px 1fr;
      gap:var(--s4);
      background:rgba(18,18,18,.7);
    }

    .iconbox{
      width:48px;
      height:48px;
      border-radius:12px;
      background:rgba(202,255,0,.07);
      border:1px solid rgba(202,255,0,.15);
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .section-alt{
      background:rgba(30,42,74,.15);
      border-top:1px solid rgba(202,255,0,.07);
      border-bottom:1px solid rgba(202,255,0,.07);
    }

    /* FAQ */

    .faq{
      display:flex;
      flex-direction:column;
      gap:var(--s3);
      margin-top:var(--s8);
    }

    details{
      padding:0;
      background:rgba(18,18,18,.7);
    }

    summary{
      padding:var(--s5) var(--s6);
      cursor:pointer;
      list-style:none;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-family:var(--display);
      text-transform:uppercase;
      font-weight:700;
    }

    summary::-webkit-details-marker{display:none;}

    .answer{
      padding:0 var(--s6) var(--s6);
      color:var(--faint);
    }

    /* CTA */

    .cta{
      text-align:center;
      padding:clamp(var(--s16),10vw,var(--s24)) 2rem;
    }

    .cta p{
      margin:var(--s4) auto var(--s8);
    }

    .btns{
      display:flex;
      gap:1rem;
      justify-content:center;
      flex-wrap:wrap;
    }

    .btn1,
    .btn2{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:52px;
      padding:.9rem 2rem;
      border-radius:8px;
      font-family:var(--display);
      font-size:.9rem;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.06em;
    }

    .btn1{
      background:var(--coral);
      color:#fff;
    }

    .btn2{
      border:1.5px solid var(--yellow);
      color:var(--yellow);
    }

    /* Footer */

    footer{
      border-top:1px solid rgba(202,255,0,.08);
      padding:2rem;
    }

    .footer{
      max-width:var(--max);
      margin:auto;
      display:flex;
      justify-content:space-between;
      gap:1rem;
      flex-wrap:wrap;
      color:var(--faint);
      font-size:.8rem;
    }

    .footer a{
      color:var(--faint);
    }

    /* Responsive */

    @media (max-width:900px){
      nav{padding:1rem 1.25rem;}
      .nav-links{display:none;}
      .three-layout,
      .content-grid,
      .two,
      .steps,
      .deliverables{
        grid-template-columns:1fr;
      }
      .full{grid-column:auto;}
      .hero{min-height:auto;padding-top:7rem;}
    }
  </style>
</head>
